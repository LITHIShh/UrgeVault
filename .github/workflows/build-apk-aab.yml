name: Build APK and Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkey -v -keystore app/release.jks -alias betshield -keyalg RSA -keysize 2048 -validity 10000 -storepass BetShield@2026 -keypass BetShield@2026 -dname "CN=BetShield, OU=Mobile, O=BetShield, L=City, S=State, C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK and Play Store AAB
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-Installable-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-GooglePlay-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
