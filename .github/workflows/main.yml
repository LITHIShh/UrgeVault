name: UrgeVault CI - Build APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APKs and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate Android Project Directory
        id: locate-project
        run: |
          if [ -f "./BetShield/gradlew" ]; then
            echo "project_dir=BetShield" >> $GITHUB_ENV
          else
            echo "project_dir=." >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./${{ env.project_dir }}/gradlew

      - name: Generate Production Signing Keystore
        run: |
          keytool -genkey -v -keystore ${{ env.project_dir }}/app/release.jks \
            -alias betshield \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BetShield@2026 \
            -keypass BetShield@2026 \
            -dname "CN=UrgeVault, OU=Mobile, O=UrgeVault, L=SanFrancisco, S=CA, C=US"

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd ${{ env.project_dir }}
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_debug.log

      - name: Dump Gradle Error to Annotations and Job Summary
        if: failure()
        run: |
          if [ -f "${{ env.project_dir }}/gradle_debug.log" ]; then
            echo "### ❌ Gradle Debug Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ${{ env.project_dir }}/gradle_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(^e: |^w: |FAILURE:|Execution failed|What went wrong:)" ${{ env.project_dir }}/gradle_debug.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=DebugBuildError::$line"
            done
            tail -n 25 ${{ env.project_dir }}/gradle_debug.log | while IFS= read -r line; do
              echo "::warning title=TailLog::$line"
            done
          fi

      - name: Build Release APK and Play Store AAB
        run: |
          set -o pipefail
          cd ${{ env.project_dir }}
          ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee gradle_release.log

      - name: Dump Release Error to Annotations and Job Summary
        if: failure()
        run: |
          if [ -f "${{ env.project_dir }}/gradle_release.log" ]; then
            echo "### ❌ Release Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ${{ env.project_dir }}/gradle_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(^e: |^w: |FAILURE:|Execution failed|What went wrong:)" ${{ env.project_dir }}/gradle_release.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=ReleaseBuildError::$line"
            done
          fi

      - name: Upload Build Logs Always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            ${{ env.project_dir }}/gradle_debug.log
            ${{ env.project_dir }}/gradle_release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Debug & Release Installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: UrgeVault-Installable-APKs
          path: ${{ env.project_dir }}/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Signed Play Store AAB (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: UrgeVault-GooglePlay-AAB
          path: ${{ env.project_dir }}/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Write GitHub Actions Job Summary
        run: |
          echo "### 🚀 UrgeVault Android Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output Artifact | Purpose | Download Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **UrgeVault-Installable-APKs** | Direct `.apk` installation on any Android phone | Artifacts section below |" >> $GITHUB_STEP_SUMMARY
          echo "| **UrgeVault-GooglePlay-AAB** | Official `.aab` production bundle for Google Play Console | Artifacts section below |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ✨ Included Features:" >> $GITHUB_STEP_SUMMARY
          echo "- **Multi-Addiction Categories:** Betting (500+ preloaded), Adult Content, Social Media Detox, Gaming, Crypto" >> $GITHUB_STEP_SUMMARY
          echo "- **Dual-Engine Blocker:** Local DNS Sinkhole (port 53 UDP) + Browser URL Bar Inspector (Chrome, Edge, Firefox, Brave)" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-Start on Reboot:** Persistent boot receiver (`directBootAware`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Urge SOS:** 60s Grounding breath & 15m Craving Delay (Strictly 100% Ad-Free)" >> $GITHUB_STEP_SUMMARY
          echo "- **Money & Time Vault:** Real-time baseline savings calculations and customizable goals" >> $GITHUB_STEP_SUMMARY
          echo "- **Progress Garden:** 5-stage living sanctuary with milestone badges without shame" >> $GITHUB_STEP_SUMMARY
          echo "- **AdMob Monetization:** Ethical, non-intrusive bottom banner" >> $GITHUB_STEP_SUMMARY
